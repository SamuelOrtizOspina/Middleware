# CloudAMQP / RabbitMQ connection
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.dynamic=true

# Fail fast if broker is not reachable when the app starts
spring.rabbitmq.listener.simple.missing-queues-fatal=true
spring.rabbitmq.listener.direct.missing-queues-fatal=true

# Queue name (kept as requested in your instructions)
app.messaging.queue-name=${APP_QUEUE_NAME:java:/jms/queue/CorreoQueue}

# Keep fail-fast enabled by default. Set false only for local runs without RabbitMQ.
app.messaging.startup-verify=${APP_MESSAGING_STARTUP_VERIFY:true}
